<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Low-Poly CRT Terminal - Phosphor Edition</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      height: 100vh;
      background-color: #030803; 
      color: #00ff66; 

      background-image: url('70SMONITOR.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      
      font-family: 'VT323', monospace;
      font-size: 36px;
      line-height: 1.3;
      
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.9), 0 0 14px rgba(0, 255, 102, 0.4); 
      filter: contrast(175%) brightness(105%);
      
      overflow: hidden;
      position: relative;
      image-rendering: pixelated;
      transition: opacity 2s ease;
    }

    /* Output Canvas Wrapper */
    #notepad {
      width: 100%;
      outline: none;
      white-space: pre-wrap;
      word-wrap: break-word;
      display: inline;
    }

    /* Matrix Stream Layout Grid: Fixed structural layout */
    #matrix-container {
      position: absolute;
      top: -50px; left: 0; right: 0; bottom: -50px;
      display: flex;
      justify-content: space-around;
      padding: 0 10px;
      overflow: hidden;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
    }
    #matrix-container.active {
      opacity: 1;
    }
    .matrix-col {
      white-space: pre;
      text-align: center;
      line-height: 0.9;
      font-size: 24px;
    }

    /* System Execution State Modifiers */
    body.screen-flash-off {
      color: transparent !important;
      text-shadow: none !important;
      background-color: #000000 !important;
    }
    body.screen-flash-off #matrix-container {
      opacity: 0 !important;
    }

    body.system-dead {
      opacity: 0; 
    }

    /* Terminal Flashing Hardware Caret */
    .terminal-cursor {
      display: inline-block;
      width: 18px;
      height: 32px;
      background-color: #00ff66;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.9);
      vertical-align: middle;
      margin-left: 4px;
      animation: blink 0.8s steps(2, start) infinite;
    }
    .terminal-cursor.hidden {
      display: none;
    }

    @keyframes blink {
      to { visibility: hidden; }
    }

    /* Glitch Animation for ACCEPTED state */
    .glitch-text {
      color: #ffaa00; 
      text-shadow: 4px 0 #ff3300, -4px 0 #00ff66;
      animation: hardwareGlitch 0.15s infinite;
      font-weight: bold;
    }

    body.terminal-spazzing {
      animation: fatalScreenShake 0.08s infinite;
    }

    @keyframes fatalScreenShake {
      0% { transform: translate(4px, 2px); }
      20% { transform: translate(-3px, -4px); }
      40% { transform: translate(3px, -2px); }
      60% { transform: translate(-4px, 3px); }
      80% { transform: translate(2px, -3px); }
      100% { transform: translate(-3px, 4px); }
    }

    @keyframes hardwareGlitch {
      0% { text-shadow: 5px 0 #ff3300, -3px 0 #ffaa00; transform: translate(2px, 0); }
      20% { text-shadow: -5px 0 #00ff66, 3px 0 #ff3300; transform: translate(-2px, 2px); }
      40% { text-shadow: 3px 0 #ffaa00, -5px 0 #ff3300; transform: translate(-3px, -2px); }
      60% { text-shadow: -3px 0 #ff3300, 5px 0 #ffaa00; transform: translate(3px, 2px); }
      100% { text-shadow: -5px 0 #ffaa00, 3px 0 #00ff66; transform: translate(2px, 0); }
    }

    /* THICK BLOCKY CRT MONITOR LINES */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 40%, 
        rgba(0, 0, 0, 0.7) 40%
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 2;
      animation: crtSyncSlip 7s infinite;
    }

    body.terminal-spazzing::after {
      animation: crtSyncSlip 0.3s infinite !important;
    }

    @keyframes crtSyncSlip {
      0%, 90% { background-position: 0 0; }
      91% { background-position: 0 6px; }
      93% { background-position: 0 16px; }
      95% { background-position: 0 2px; }
      96%, 100% { background-position: 0 0; }
    }
  </style>
</head>
<body>
  .terminal-screen {
  position: absolute;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 58vw;
  height: 52vh;
  overflow-y: auto;
  font-size: 14px;
  box-sizing: border-box;
  padding: 15px;
}
  <div class="terminal-screen">
  <div id="notepad"></div><span id="cursor" class="terminal-cursor"></span>
  
  <div id="matrix-container"></div>
  </div>

  <script>
    const sequence = [
      "AMIBIOS (C) 1994 American Megatrends Inc.\n",
      "CPU: CUSTOM BIO-PROCESSOR ARRAY @ 5.20 GHz\n",
      "Memory Test: 134217728K OK (128 GB RAM)\n",
      "Detecting Primary Storage...\n",
      "[UCPLASTS_LINK_OK]\n",
      "Loading MS-DOS SHIM...\n",
      "C:\\> C:\\VANCE_SYS\\COMMS_ARR.EXE\n"
    ];

    const displayContainer = document.getElementById("notepad");
    const cursor = document.getElementById("cursor");
    const matrixBox = document.getElementById("matrix-container");
    let sequenceIndex = 0;
    let loopInterval; 
    let sputterTimeout;

    const zalgoMarks = [];
    for (let i = 0x0300; i <= 0x036F; i++) {
      zalgoMarks.push(String.fromCharCode(i));
    }

    const crashChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*()<>{}[]?/\\";

    function generateZalgoChar() {
      let base = crashChars.charAt(Math.floor(Math.random() * crashChars.length));
      let stackCount = Math.floor(Math.random() * 5) + 3; 
      for (let i = 0; i < stackCount; i++) {
        base += zalgoMarks[Math.floor(Math.random() * zalgoMarks.length)];
      }
      return base;
    }

    function processNextChunk() {
      if (sequenceIndex < sequence.length) {
        let currentString = sequence[sequenceIndex];
        let charIndex = 0;

        function printLetterByLetter() {
          if (charIndex < currentString.length) {
            let nextChar = currentString.charAt(charIndex);

            if (nextChar === '<') {
              let tagEndIndex = currentString.indexOf('>', charIndex);
              displayContainer.innerHTML += currentString.substring(charIndex, tagEndIndex + 1);
              charIndex = tagEndIndex + 1;
            } else {
              displayContainer.innerHTML += nextChar;
              charIndex++;
            }

            let dynamicInterval = 20; 
            if (nextChar === '.') {
              dynamicInterval = 3000;  
            } else if (nextChar === ':') {
              dynamicInterval = 150;  
            }

            setTimeout(printLetterByLetter, dynamicInterval);
          } else {
            sequenceIndex++;
            setTimeout(processNextChunk, 400); 
          }
        }

        printLetterByLetter();
      } else {
        typeSlowPrompt("ENTER SECURITY AUTHENTICATION KEY: ", 0, () => {
          typeSlowPrompt("\n. . .\n", 0, () => {
            setTimeout(() => {
              displayContainer.innerHTML += "<span class='glitch-text'>[ ACCESS ACCEPTED ]</span>\n";
              setTimeout(triggerSystemSpazzout, 1000);
            }, 500);
          });
        });
      }
    }

    function typeSlowPrompt(textStr, index, callback) {
      if (index < textStr.length) {
        let char = textStr.charAt(index);
        displayContainer.innerHTML += char;
        window.scrollTo(0, document.body.scrollHeight);
        
        let delay = 80; 
        if (char === '.') {
          delay = 1000; 
        }
        
        setTimeout(() => {
          typeSlowPrompt(textStr, index + 1, callback);
        }, delay);
      } else {
        callback();
      }
    }

    function triggerSystemSpazzout() {
      cursor.classList.add("hidden");
      document.body.classList.add("terminal-spazzing");
      
      displayContainer.style.display = "none";
      matrixBox.classList.add("active");

      const colCount = Math.floor(window.innerWidth / 35);
      const columnsData = [];
      
      for(let i = 0; i < colCount; i++) {
        let colDiv = document.createElement("div");
        colDiv.className = "matrix-col";
        matrixBox.appendChild(colDiv);
        
        columnsData.push({
          element: colDiv,
          chars: [],
          direction: i % 2 === 0 ? "down" : "up"
        });
      }

      loopInterval = setInterval(() => {
        columnsData.forEach(col => {
          const newChar = generateZalgoChar();
          
          if (col.direction === "down") {
            col.chars.push(newChar);
            if (col.chars.length > 55) col.chars.shift();
          } else {
            col.chars.unshift(newChar);
            if (col.chars.length > 55) col.chars.pop();
          }
          
          col.element.innerHTML = col.chars.join("\n");
        });
      }, 50);

      setTimeout(() => {
        runSporadicSputter(5000); 
      }, 7000); 
    }

    function runSporadicSputter(timeLeft) {
      if (timeLeft <= 0) {
        clearInterval(loopInterval);
        clearTimeout(sputterTimeout);
        document.body.classList.remove("terminal-spazzing");
        document.body.classList.remove("screen-flash-off");
        document.body.classList.add("system-dead");
        return;
      }

      let darkInterval = Math.floor(Math.random() * 120) + 30; 
      let lightInterval = Math.floor(Math.random() * 400) + 50; 

      document.body.classList.add("screen-flash-off");

      sputterTimeout = setTimeout(() => {
        document.body.classList.remove("screen-flash-off");
        
        sputterTimeout = setTimeout(() => {
          runSporadicSputter(timeLeft - (darkInterval + lightInterval));
        }, lightInterval);

      }, darkInterval);
    }

    window.onload = processNextChunk;
  </script>

</body>
</html>
