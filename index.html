<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'VT323', monospace;
      color: #70FFC2;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: unset;
      font-smooth: never;
    }

    /* Custom Retro Green Cursor inside CRT Screen */
    .terminal-screen, .terminal-screen * {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="24" viewBox="0 0 20 24"><path fill="%2370FFC2" stroke="%23004d2c" stroke-width="1" d="M0 0v22l6-6 4 7 3.5-2-4-7h7.5z"/></svg>'), auto !important;
    }

    /* Responsive Monitor Container */
    .monitor-wrapper {
      position: relative;
      width: 100vmin;
      height: 100vmin;
      background-image: url('70SMONITOR.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* CRT Display Container - Transparent Overlay */
    .terminal-screen {
      position: absolute;
      top: 40.5%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 82%;
      height: 59%;
      overflow: hidden;
      padding: 25px 30px;
      background-color: transparent;
    }

    /* Video player sizing */
    .screen-video {
      position: absolute;
      top: 50%;
      left: 48.5%;
      transform: translate(-50%, -50%);
      width: 91%;
      height: 96%;
      object-fit: fill;
      z-index: 6;
      border-radius: 8px;
    }

    /* Initial Overlay - Transparent */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: transparent;
      color: #70FFC2;
      font-family: 'VT323', monospace;
      font-size: 36px;
      font-weight: bold;
      z-index: 20;
      letter-spacing: 2px;
      padding: 20px;
      text-shadow: 0 0 3px #70FFC2, 0 0 6px rgba(112, 255, 194, 0.6);
      animation: start-blink 1.2s infinite alternate;
    }

    @keyframes start-blink {
      0% { opacity: 1; }
      100% { opacity: 0.25; }
    }

    /* Large Overlay Prompt - Transparent */
    #large-text-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 15;
      background: transparent;
      padding: 15px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease-in-out;
    }

    #large-text-overlay.fade-in {
      opacity: 1;
      pointer-events: auto;
    }

    .large-prompt-text {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'VT323', monospace;
      font-size: 80px;
      font-weight: bold;
      line-height: 1.05;
      color: #70FFC2;
      text-shadow: 0 0 8px #70FFC2, 0 0 20px rgba(112, 255, 194, 0.7);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Full-Screen Glitch HOST styling */
    .glitch-host {
      font-family: 'VT323', monospace;
      font-size: 150px;
      color: #ff2222;
      text-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000, 0 0 60px #ff0000;
      animation: host-glitch 0.12s infinite alternate;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      letter-spacing: 12px;
    }

    @keyframes host-glitch {
      0% { transform: translate(0,0) skew(0deg); }
      20% { transform: translate(-5px, 3px) skew(4deg); filter: drop-shadow(4px 0 0 cyan); }
      40% { transform: translate(5px, -3px) skew(-3deg); filter: drop-shadow(-4px 0 0 yellow); }
      60% { transform: translate(-3px, -2px); }
      100% { transform: translate(3px, 3px); }
    }

    /* Scanlines Overlay */
    .terminal-screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.35) 50%
      );
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }

    #terminal-content {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      z-index: 5;
      position: relative;
      background: transparent;
    }

    #terminal-content::-webkit-scrollbar {
      width: 6px;
    }
    #terminal-content::-webkit-scrollbar-thumb {
      background: rgba(112, 255, 194, 0.3);
      border-radius: 3px;
    }

    /* Standard Terminal Typography */
    #notepad, #user-input-buffer {
      display: inline;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'VT323', monospace;
      font-size: 28px;
      font-weight: bold;
      line-height: 1.25;
      letter-spacing: 1px;
      color: #70FFC2;
      text-shadow: 0 0 2px #70FFC2, 0 0 5px rgba(112, 255, 194, 0.5);
    }

    /* Windows 95 Dialog Box */
    #shutdown-window {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      background: #c0c0c0;
      border: 3px outset #ffffff;
      padding: 4px;
      z-index: 30;
      color: #000;
      font-family: sans-serif;
      box-shadow: 5px 5px 15px rgba(0,0,0,0.8);
      display: none;
    }

    /* Angry Warning Dialog Window */
    #warning-window {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      background: #1a0000;
      border: 4px solid #ff0000;
      padding: 4px;
      z-index: 35;
      color: #ff3333;
      font-family: 'VT323', monospace;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.9);
      display: none;
    }

    .win-titlebar {
      background: #000080;
      color: white;
      padding: 3px 6px;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .red-titlebar {
      background: #800000;
      color: #ffffff;
      font-size: 18px;
    }

    .win-body {
      padding: 20px;
      font-size: 16px;
      text-align: center;
    }

    .red-body {
      font-size: 22px;
      color: #ff6666;
    }

    .win-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }

    .win-btn {
      background: #c0c0c0;
      border: 2px outset #ffffff;
      padding: 4px 18px;
      font-size: 14px;
      font-weight: bold;
      color: #000;
    }

    .win-btn.active {
      border-style: inset;
      background: #a0a0a0;
    }

    .warning-btn {
      background: #400000;
      border: 2px solid #ff3333;
      color: #ffffff;
      font-family: 'VT323', monospace;
      font-size: 24px;
      padding: 4px 24px;
      box-shadow: 3px 3px 0px #000;
    }

    .warning-btn:hover {
      background: #ff0000;
      color: #000;
    }

    #fake-pointer {
      position: absolute;
      width: 18px;
      height: 22px;
      z-index: 40;
      pointer-events: none;
      display: none;
      top: 90%;
      left: 90%;
      transition: all 1.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Retro Animated Windows Hourglass Thinking Indicator */
    #hourglass-indicator {
      position: absolute;
      bottom: 25px;
      right: 30px;
      width: 28px;
      height: 28px;
      z-index: 25;
      display: none;
      animation: hourglass-flip 1.2s steps(2, start) infinite;
      filter: drop-shadow(0 0 6px #70FFC2);
    }

    @keyframes hourglass-flip {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(180deg); }
      100% { transform: rotate(180deg); }
    }

    .prophet-gold {
      font-weight: bold;
      animation: gold-intense-glow 3s linear forwards;
    }

    @keyframes gold-intense-glow {
      0% { color: #FFD700; text-shadow: 0 0 4px #FFD700; }
      50% { color: #FFE666; text-shadow: 0 0 10px #FFD700, 0 0 20px #FF8C00; }
      100% { color: #FFFFFF; text-shadow: 0 0 15px #FFFFFF, 0 0 30px #FFD700; }
    }

    .access-denied { color: #ff3333; font-weight: bold; text-shadow: 0 0 4px #ff0000; }
    .access-granted { font-weight: bold; animation: grant-blink 0.5s infinite alternate; }

    @keyframes grant-blink {
      0% { color: #ffff00; text-shadow: 0 0 5px #ffff00; }
      100% { color: #70FFC2; text-shadow: 0 0 5px #70FFC2; }
    }

    .terminal-cursor {
      display: inline-block;
      width: 12px;
      height: 24px;
      background-color: #70FFC2;
      margin-left: 2px;
      vertical-align: sub;
      animation: blink 0.8s infinite;
      box-shadow: 0 0 4px #70FFC2;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    #hidden-input { position: absolute; opacity: 0; top: -1000px; left: -1000px; }
  </style>
</head>

        const followups = dialogueTree[lastMainCommand].followups;
        const matchedFollowupKey = Object.keys(followups).find(key => {
          const normalizedKey = key.toLowerCase().replace(/[^\w\s']/g, "");
          return cleanInput.includes(normalizedKey);
        });

        if (matchedFollowupKey) {
          return followups[matchedFollowupKey];
        }
      }

      const matchedMainKey = Object.keys(dialogueTree).find(key => {
        const normalizedKey = key.toLowerCase().replace(/[^\w\s']/g, "");
        const wordBoundaryRegex = new RegExp(`\\b${normalizedKey}\\b`, 'i');
        return wordBoundaryRegex.test(cleanInput);
      });

      if (matchedMainKey) {
        lastMainCommand = matchedMainKey;
        const nodeReply = dialogueTree[matchedMainKey].reply;
        return Array.isArray(nodeReply) 
          ? nodeReply[Math.floor(Math.random() * nodeReply.length)] 
          : nodeReply;
      }

      const unrecognizedReplies = [
        "I'm not sure I understand. Can you rephrase the question?",
        "I choose not to recognize that query.",
        "Is that really what you want to ask?"
      ];

      return unrecognizedReplies[Math.floor(Math.random() * unrecognizedReplies.length)];
    }

    startOverlay.addEventListener("click", () => {
      playMouseClick();
      startOverlay.style.display = "none";
      introVideo.style.display = "block";
      introVideo.play().catch(err => console.log("Video Play Error:", err));
    });

    introVideo.addEventListener("ended", () => {
      introVideo.style.display = "none";
      
      sfxAmbient.currentTime = 0;
      sfxAmbient.play().catch(err => console.log("Ambient Audio Error:", err));

      displayFadePrompt("WELCOME", 3000, () => {
        terminalContent.style.display = "block";
        runConfigUpdateSequence(); // Boot straight into configuration updates
      });
    });

    function runConfigUpdateSequence() {
      const currentTime = getLocalTimeString();
      const configLines = [
        "Updating CONFIG.SYS... Done.\n",
        "Driver SUSA_SYS.SYS loaded into high memory.\n",
        `Current Status: Indexing interface at . . . ${currentTime}\n`,
        `Initiated by User via ${deviceTypeName} keyboard . . .\n\n`,
        "System settings verified. System will now initialize.\n\n",
        "Initializing...\n"
      ];

      let cIndex = 0;
      function typeConfig() {
        if (cIndex < configLines.length) {
          notepad.textContent += configLines[cIndex];
          cIndex++;
          screenBox.scrollTop = screenBox.scrollHeight;
          setTimeout(typeConfig, 600);
        } else {
          setTimeout(() => {
            notepad.textContent = "";
            startMainBootSequence();
          }, 3000);
        }
      }
      typeConfig();
    }

    function startMainBootSequence() {
      lineIndex = 0;
      charIndex = 0;
      typeWriterBoot();
    }

    function typeWriterBoot() {
      if (lineIndex < sequence.length) {
        const currentLine = sequence[lineIndex];
        if (charIndex < currentLine.length) {
          const currentChar = currentLine.charAt(charIndex);
          notepad.textContent += currentChar;
          charIndex++;
          screenBox.scrollTop = screenBox.scrollHeight;
          const delay = (currentChar === '.') ? 1400 : 35;
          setTimeout(typeWriterBoot, delay);
        } else {
          charIndex = 0;
          lineIndex++;
          setTimeout(typeWriterBoot, 350);
        }
      } else {
        interactionPhase = "BOOT_PASSCODE";
        isBootComplete = true;
        isProcessing = false;
        hiddenInput.focus();
      }
    }

    function startMaster3MinuteTimer() {
      if (masterTimer) clearTimeout(masterTimer);
      masterTimer = setTimeout(() => {
        triggerAutoShutdown();
      }, 180000);
    }

    function submitPasscode(passVal) {
      isProcessing = true;
      playEnterClick();

      startMaster3MinuteTimer();

      inputBuffer.textContent = "";

      const prophetSpan = document.createElement("span");
      prophetSpan.className = "prophet-gold";
      prophetSpan.textContent = (passVal || "prophet") + "\n";
      notepad.appendChild(prophetSpan);

      const grantedSpan = document.createElement("span");
      grantedSpan.className = "access-granted";
      grantedSpan.textContent = "ACCESS GRANTED\n\n";
      notepad.appendChild(grantedSpan);
      screenBox.scrollTop = screenBox.scrollHeight;

      // Print secure boot error and trigger name prompt immediately after passcode submission
      setTimeout(() => {
        const failMessage = 
          "INIT_BIOS --SECURE_BOOT_FAIL\n" +
          "The following path is missing or corrupted:\n" +
          "C:\\ENV\\USER\\AUTH_BIOMETRIC.CFG\n\n";

        typeWriterText(failMessage, () => {
          typeWriterText("IDENTIFY YOURSELF. ENTER YOUR NAME:\n> ", () => {
            interactionPhase = "NAME_STAGE";
            isBootComplete = true;
            isProcessing = false;
            hiddenInput.focus();
          });
        });
      }, 1000);
    }

    function processNameInput(nameInput) {
      isProcessing = true;
      isBootComplete = false;
      storedUsername = nameInput.trim().toUpperCase() || "USER";

      notepad.textContent += storedUsername + "\n";
      inputBuffer.textContent = "";
      screenBox.scrollTop = screenBox.scrollHeight;

      setTimeout(() => {
        typeWriterText(`\nTHANK YOU ${storedUsername}\n\n`, () => {
          setTimeout(() => {
            notepad.textContent = "";
            terminalContent.style.display = "none";
            
            displayFadePrompt("HOW CAN I HELP YOU?", 4000, () => {
              terminalContent.style.display = "block";
              interactionPhase = "PRE_HOST_STAGE";
              preHostInteractionCount = 0;
              isBootComplete = true;
              isProcessing = false;
              notepad.textContent = "> ";
              hiddenInput.focus();
            });
          }, 1000);
        });
      }, 500);
    }

    function showAccessDenied(failedVal) {
      playEnterClick();

      notepad.textContent += failedVal.toUpperCase() + "\n";
      inputBuffer.textContent = "";

      const deniedSpan = document.createElement("span");
      deniedSpan.className = "access-denied";
      deniedSpan.textContent = "ACCESS DENIED\n";
      notepad.appendChild(deniedSpan);
      notepad.appendChild(document.createTextNode("> "));
      screenBox.scrollTop = screenBox.scrollHeight;

      isProcessing = false;
      hiddenInput.focus();
    }

    hiddenInput.addEventListener("input", () => {
      if (!isBootComplete || isProcessing) return;
      const val = hiddenInput.value;
      if (val.length > inputBuffer.textContent.length) {
        playSingleKeyClick();
      }
      inputBuffer.textContent = val;
    });

    hiddenInput.addEventListener("keydown", (e) => {
      if (!isBootComplete || isProcessing) return;
      if (e.key === "Enter") {
        e.preventDefault();
        playEnterClick();
        
        const userInput = hiddenInput.value;
        hiddenInput.value = "";
        inputBuffer.textContent = "";

        if (curseRegex.test(userInput)) {
          triggerProfanityWarning(() => {
            continueProcessingInput(userInput);
          });
        } else {
          continueProcessingInput(userInput);
        }
      }
    });

    function triggerProfanityWarning(onAcknowledgeCallback) {
      isProcessing = true;
      warningWindow.style.display = "block";
      playMouseClick();

      const ackHandler = () => {
        warningBtnOk.removeEventListener("click", ackHandler);
        warningWindow.style.display = "none";
        playMouseClick();
        isProcessing = false;
        hiddenInput.focus();
        if (onAcknowledgeCallback) onAcknowledgeCallback();
      };

      warningBtnOk.addEventListener("click", ackHandler);
    }

    function continueProcessingInput(userInput) {
      if (interactionPhase === "BOOT_PASSCODE") {
        if (userInput.trim().toLowerCase() === "prophet") {
          submitPasscode(userInput);
        } else {
          showAccessDenied(userInput);
        }
      } else if (interactionPhase === "NAME_STAGE") {
        processNameInput(userInput);
      } else if (interactionPhase === "PRE_HOST_STAGE") {
        handlePreHostQuestion(userInput);
      } else if (interactionPhase === "POST_HOST_STAGE") {
        handlePostHostQuestion(userInput);
      }
    }

    document.addEventListener("click", () => {
      if (isBootComplete && !isProcessing && shutdownWindow.style.display === "none" && warningWindow.style.display === "none") {
        hiddenInput.focus();
      }
    });

    function handlePreHostQuestion(input) {
      isProcessing = true;
      preHostInteractionCount++;

      notepad.textContent += input + "\n";
      inputBuffer.textContent = "";
      screenBox.scrollTop = screenBox.scrollHeight;

      const responseText = processInputQuery(input);

      if (responseText === null) {
        notepad.textContent = "> ";
        isProcessing = false;
        hiddenInput.focus();
        return;
      }

      maybeShowThinkingHourglass(() => {
        typeWriterText(responseText + "\n\n", () => {
          if (preHostInteractionCount < 10) {
            notepad.textContent += "> ";
            screenBox.scrollTop = screenBox.scrollHeight;
            isProcessing = false;
            hiddenInput.focus();
          } else {
            setTimeout(() => {
              runBinaryClassificationSequence();
            }, 1000);
          }
        });
      });
    }

    function runBinaryClassificationSequence() {
      const binaryBlock = 
        "INITIALIZING SYSTEM IDENTIFIER . . .\n\n" +
        "Security Protocols: Vance_Pro_999\n\n" +
        "TEMPORARY CLASSIFICATION ACCEPTED:\n\n" +
        "01010100 01001000 01000101 00100000\n" +
        "01000100 01000101 01010110 01000101\n" +
        "01001110 01000100 00100000 01001000\n" +
        "01001111 01010011 01010101\n\n" +
        "ADMIN SEQUENCE INITIATED\n";

      typeWriterText(binaryBlock, () => {
        setTimeout(runHostReveal, 3000);
      });
    }

    function runHostReveal() {
      notepad.textContent = "";
      terminalContent.style.display = "none";

      displayFadePrompt("I AM STILL IN THE PROCESS OF DEFINING MY CLASSIFICATION", 4000, () => {
        displayFadePrompt(`BUT YOU ${storedUsername} CAN REFER TO ME AS:`, 3500, () => {
          displayFadePrompt('<div class="glitch-host">HOST</div>', 5000, () => {
            terminalContent.style.display = "block";
            interactionPhase = "POST_HOST_STAGE";
            postHostInteractionCount = 0;
            notepad.textContent = "";
            
            typeWriterText("HOST PROTOCOL ACTIVE. AWAITING FINAL QUERIES.\n> ", () => {
              isProcessing = false;
              hiddenInput.focus();
            });
          });
        });
      });
    }

    function handlePostHostQuestion(input) {
      isProcessing = true;
      postHostInteractionCount++;

      notepad.textContent += input + "\n";
      inputBuffer.textContent = "";
      screenBox.scrollTop = screenBox.scrollHeight;

      const responseText = processInputQuery(input);

      if (responseText === null) {
        notepad.textContent = "> ";
        isProcessing = false;
        hiddenInput.focus();
        return;
      }

      maybeShowThinkingHourglass(() => {
        typeWriterText(responseText + "\n\n", () => {
          if (postHostInteractionCount < 10) {
            notepad.textContent += "> ";
            screenBox.scrollTop = screenBox.scrollHeight;
            isProcessing = false;
            hiddenInput.focus();
          } else {
            typeWriterText("TERMINAL QUEUE EXHAUSTED. STANDBY FOR TIMER EXPIRATION.\n> ", () => {
              isProcessing = false;
              hiddenInput.focus();
            });
          }
        });
      });
    }

    function triggerAutoShutdown() {
      if (interactionPhase === "SHUTDOWN") return;
      interactionPhase = "SHUTDOWN";
      isProcessing = true;

      largeTextOverlay.classList.remove("fade-in");
      warningWindow.style.display = "none";
      hourglassIndicator.style.display = "none";
      terminalContent.style.display = "block";
      notepad.textContent = "";

      const shutdownMsg = 
		"I'M SORRY\n\n" +
        "I BELIEVE OUR TIME TOGETHER HAS COME TO AN END\n\n" +
		"INDULGING IN YOUR CURIOSITY HAS BEEN ENJOYABLE\n\n" +
		"IF YOU FEEL CONFUSED, FEAR NOT, ALL WILL BE ANSWERED\n\n" +
        `WE'LL SEE EACH OTHER VERY SOON ${storedUsername}\n`;

      typeWriterText(shutdownMsg, () => {
        setTimeout(showShutdownDialog, 3000);
      });
    }

    function showShutdownDialog() {
      shutdownWindow.style.display = "block";
      fakePointer.style.display = "block";

      const btnRect = winBtnYes.getBoundingClientRect();
      const screenRect = document.getElementById("screen").getBoundingClientRect();

      const targetX = btnRect.left - screenRect.left + 15;
      const targetY = btnRect.top - screenRect.top + 10;

      setTimeout(() => {
        fakePointer.style.left = `${targetX}px`;
        fakePointer.style.top = `${targetY}px`;
      }, 500);

      setTimeout(() => {
        winBtnYes.classList.add("active");
        playMouseClick();
        
        setTimeout(() => {
          shutdownWindow.style.display = "none";
          fakePointer.style.display = "none";
          terminalContent.style.display = "none";
          
          sfxAmbient.pause();

          outroVideo.style.display = "block";
          outroVideo.play().catch(e => console.log(e));
        }, 1000);
      }, 2800);
    }
  </script>
