<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal AI</title>
  <!-- Import VT323 Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'VT323', monospace;
      color: #70FFC2; /* Mint Phosphor Green */
      cursor: pointer;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: unset;
      font-smooth: never;
    }

    /* Responsive Monitor Container */
    .monitor-wrapper {
      position: relative;
      width: 100vmin;
      height: 100vmin;
      background-image: url('70SMONITOR.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* CRT Display Container - Aligned to monitor glass */
    .terminal-screen {
      position: absolute;
      top: 40.5%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 82%;
      height: 59%;
      overflow: hidden;
      padding: 25px 30px;
    }

    /* Video player sizing */
    .screen-video {
      position: absolute;
      top: 50%;
      left: 48.5%;
      transform: translate(-50%, -50%);
      width: 91%;
      height: 96%;
      object-fit: fill;
      z-index: 6;
      border-radius: 8px;
    }

    /* Centered Blinking Click-to-Start Overlay */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: rgba(0, 0, 0, 0.95);
      color: #70FFC2;
      font-size: 32px;
      font-weight: bold;
      z-index: 20;
      letter-spacing: 2px;
      padding: 20px;
      text-shadow: 0 0 3px #70FFC2, 0 0 6px rgba(112, 255, 194, 0.6);
      animation: start-blink 1s infinite alternate;
    }

    @keyframes start-blink {
      0% { opacity: 1; }
      100% { opacity: 0.25; }
    }

    #terminal-content {
      width: 100%;
      height: 100%;
      overflow-y: auto;
    }

    #terminal-content::-webkit-scrollbar {
      width: 6px;
    }
    #terminal-content::-webkit-scrollbar-thumb {
      background: rgba(112, 255, 194, 0.3);
      border-radius: 3px;
    }

    /* Scanlines Overlay */
    .terminal-screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.35) 50%
      );
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }

    /* Crisp Mint Typography */
    #notepad {
      display: inline;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
      font-family: 'VT323', monospace;
      font-size: 32px;
      font-weight: bold;
      line-height: 1.15;
      letter-spacing: 1px;
      color: #70FFC2;
      text-shadow: 0 0 2px #70FFC2, 0 0 5px rgba(112, 255, 194, 0.5);
      animation: ambient-glitch 5s infinite;
    }

    #user-input-buffer {
      color: #70FFC2;
      font-family: 'VT323', monospace;
      font-size: 32px;
      font-weight: bold;
      line-height: 1.15;
      letter-spacing: 1px;
      text-shadow: 0 0 2px #70FFC2, 0 0 5px rgba(112, 255, 194, 0.5);
    }

    /* Glowing Gold 'Prophet' Text Animation */
    .prophet-gold {
      font-weight: bold;
      animation: gold-intense-glow 3s linear forwards;
    }

    @keyframes gold-intense-glow {
      0% {
        color: #FFD700;
        text-shadow: 0 0 4px #FFD700, 0 0 8px #FFA500;
      }
      50% {
        color: #FFE666;
        text-shadow: 0 0 10px #FFD700, 0 0 20px #FF8C00, 0 0 30px #FF4500;
      }
      100% {
        color: #FFFFFF;
        text-shadow: 0 0 15px #FFFFFF, 0 0 30px #FFD700, 0 0 50px #FF8C00, 0 0 70px #FF0000;
      }
    }

    @keyframes ambient-glitch {
      0%, 86%, 100% { transform: translate(0, 0) skew(0deg); filter: none; }
      87% { transform: translate(-2px, 1px) skew(0.5deg); filter: drop-shadow(1px 0 0 rgba(255, 0, 0, 0.8)); }
      88% { transform: translate(2px, -1px) skew(-0.5deg); filter: drop-shadow(-1px 0 0 rgba(0, 255, 255, 0.8)); }
      89% { transform: translate(-1px, 1px); filter: none; }
      90% { transform: translate(0, 0); }
      94% { transform: translate(1px, -1px); filter: drop-shadow(1px 0 0 rgba(112, 255, 194, 0.9)); }
      95% { transform: translate(0, 0); }
    }

    .access-denied {
      color: #ff3333;
      font-weight: bold;
      text-shadow: 0 0 4px #ff0000;
    }

    .access-granted {
      font-weight: bold;
      animation: grant-blink 0.5s infinite alternate;
    }

    @keyframes grant-blink {
      0% { color: #ffff00; text-shadow: 0 0 5px #ffff00; }
      100% { color: #70FFC2; text-shadow: 0 0 5px #70FFC2; }
    }

    .terminal-cursor {
      display: inline-block;
      width: 14px;
      height: 28px;
      background-color: #70FFC2;
      margin-left: 2px;
      vertical-align: sub;
      animation: blink 0.8s infinite;
      box-shadow: 0 0 4px #70FFC2;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    #hidden-input {
      position: absolute;
      opacity: 0;
      top: -1000px;
      left: -1000px;
    }
  </style>
</head>
<body>

  <input type="text" id="hidden-input" autocomplete="off" spellcheck="false" />

  <div class="monitor-wrapper">
    <div class="terminal-screen" id="screen">

      <!-- Click Overlay -->
      <div id="start-overlay">[ CLICK TO INITIALIZE TERMINAL ]</div>

      <!-- Audio Elements -->
      <audio id="sfx-ambient" src="windows95audio.mp3" preload="auto"></audio>
      <audio id="sfx-mouse" src="windows95mouse.mp3" preload="auto"></audio>
      <audio id="sfx-typing" src="windows95keyboardtyping.mp3" preload="auto"></audio>
      <audio id="sfx-enter" src="windows95enterkey.mp3" preload="auto"></audio>

      <!-- Intro Video -->
      <video id="intro-video" class="screen-video" playsinline style="display: none;">
        <source src="AISCREEN1.mp4" type="video/mp4">
      </video>

      <!-- Interactive Code Terminal -->
      <div id="terminal-content" style="display: none;">
        <span id="notepad"></span><span id="user-input-buffer"></span><span id="cursor" class="terminal-cursor"></span>
      </div>

      <!-- Outro Video -->
      <video id="outro-video" class="screen-video" playsinline style="display: none;">
        <source src="AISCREEN2.mp4" type="video/mp4">
      </video>

    </div>
  </div>

  <script>
    const sequence = [
      "AMIBIOS (C) 1994 American Megatrends Inc.\n",
      "CPU: CUSTOM BIO-PROCESSOR ARRAY @ 5.20 GHz\n",
      "Memory Test: 134217728K OK (128 GB RAM)\n",
      "Detecting Primary Storage...\n",
      "[UCPLASTS_LINK_OK]\n",
      "Loading MS-DOS SHIM...\n",
      "C:\\> C:\\VANCE_SYS\\COMMS_ARR.EXE\n\n",
      "SECURITY OVERRIDE REQUIRED.\n",
      "ENTER SYSTEM PASSCODE:\n> "
    ];

    const startOverlay = document.getElementById("start-overlay");
    const introVideo = document.getElementById("intro-video");
    const outroVideo = document.getElementById("outro-video");
    const terminalContent = document.getElementById("terminal-content");
    const notepad = document.getElementById("notepad");
    const inputBuffer = document.getElementById("user-input-buffer");
    const screenBox = document.getElementById("terminal-content");
    const hiddenInput = document.getElementById("hidden-input");

    // Audio References
    const sfxAmbient = document.getElementById("sfx-ambient");
    const sfxMouse = document.getElementById("sfx-mouse");
    const sfxTyping = document.getElementById("sfx-typing");
    const sfxEnter = document.getElementById("sfx-enter");

    let lineIndex = 0;
    let charIndex = 0;
    let isBootComplete = false;
    let isProcessing = false;

    sfxAmbient.volume = 0.4;

    // Safely cut ambient background track 4 seconds before natural end
    sfxAmbient.addEventListener("timeupdate", () => {
      if (sfxAmbient.duration && !isNaN(sfxAmbient.duration) && sfxAmbient.duration > 4) {
        if (sfxAmbient.currentTime >= (sfxAmbient.duration - 4)) {
          sfxAmbient.pause();
        }
      }
    });

    // Single key click sound pulse
    function playSingleKeyClick() {
      const clickInstance = sfxTyping.cloneNode();
      clickInstance.volume = 0.5;
      clickInstance.play().catch(err => console.log("Typing Audio Error:", err));
      
      setTimeout(() => {
        clickInstance.pause();
        clickInstance.remove();
      }, 100);
    }

    // 1. Initial User Click
    startOverlay.addEventListener("click", () => {
      // Play mouse click sound
      sfxMouse.currentTime = 0;
      sfxMouse.play().catch(err => console.log("Mouse Audio Error:", err));

      // Trigger ambient audio immediately on user interaction
      sfxAmbient.currentTime = 0;
      const ambientPromise = sfxAmbient.play();
      
      if (ambientPromise !== undefined) {
        ambientPromise.catch(err => {
          console.log("Ambient Audio Playback Error:", err);
          sfxAmbient.play();
        });
      }

      startOverlay.style.display = "none";
      introVideo.style.display = "block";
      introVideo.play().catch(err => console.log("Video Play Error:", err));
    });

    // 2. Launch boot sequence after intro video
    introVideo.addEventListener("ended", () => {
      introVideo.style.display = "none";
      terminalContent.style.display = "block";
      typeWriter();
    });

    // 3. Typewriter effect
    function typeWriter() {
      if (lineIndex < sequence.length) {
        const currentLine = sequence[lineIndex];
        if (charIndex < currentLine.length) {
          const currentChar = currentLine.charAt(charIndex);
          notepad.textContent += currentChar;
          charIndex++;
          screenBox.scrollTop = screenBox.scrollHeight;

          const delay = (currentChar === '.') ? 1500 : 30;
          setTimeout(typeWriter, delay);
        } else {
          charIndex = 0;
          lineIndex++;
          setTimeout(typeWriter, 250);
        }
      } else {
        isBootComplete = true;
        hiddenInput.focus();
      }
    }

    document.addEventListener("click", () => {
      if (isBootComplete && !isProcessing && outroVideo.style.display === "none") {
        hiddenInput.focus();
      }
    });

    // 4. Keyboard Input & Sound Effects
    hiddenInput.addEventListener("input", () => {
      if (!isBootComplete || isProcessing) return;

      const currentVal = hiddenInput.value;

      if (currentVal.length > inputBuffer.textContent.length) {
        playSingleKeyClick();
      }

      inputBuffer.textContent = currentVal;
      screenBox.scrollTop = screenBox.scrollHeight;

      if (currentVal.trim().toLowerCase() === "prophet") {
        isProcessing = true;

        sfxEnter.currentTime = 0;
        sfxEnter.play().catch(err => console.log("Enter Audio Error:", err));

        hiddenInput.value = "";
        inputBuffer.textContent = "";

        const prophetSpan = document.createElement("span");
        prophetSpan.className = "prophet-gold";
        prophetSpan.textContent = currentVal + "\n";
        notepad.appendChild(prophetSpan);

        const grantedSpan = document.createElement("span");
        grantedSpan.className = "access-granted";
        grantedSpan.textContent = "ACCESS GRANTED\n";
        notepad.appendChild(grantedSpan);

        setTimeout(playOutroVideo, 3000);
      }
    });

    hiddenInput.addEventListener("keydown", (e) => {
      if (!isBootComplete || isProcessing) return;

      if (e.key === "Enter") {
        e.preventDefault();
        
        sfxEnter.currentTime = 0;
        sfxEnter.play().catch(err => console.log("Enter Audio Error:", err));

        processCommand();
      }
    });

    function processCommand() {
      const userInput = hiddenInput.value;
      if (userInput.trim() === "") return;

      notepad.textContent += userInput + "\n";
      hiddenInput.value = "";
      inputBuffer.textContent = "";
      isProcessing = true;
      screenBox.scrollTop = screenBox.scrollHeight;

      setTimeout(() => {
        const deniedSpan = document.createElement("span");
        deniedSpan.className = "access-denied";
        deniedSpan.textContent = "ACCESS DENIED\n";
        notepad.appendChild(deniedSpan);
        notepad.appendChild(document.createTextNode("> "));
        
        screenBox.scrollTop = screenBox.scrollHeight;
        isProcessing = false;
        hiddenInput.focus();
      }, 1500);
    }

    // 5. Play AISCREEN2.mp4
    function playOutroVideo() {
      terminalContent.style.display = "none";
      outroVideo.style.display = "block";
      outroVideo.play().catch(err => console.log("Outro Video Play Error:", err));
    }
  </script>

</body>
</html>
