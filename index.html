<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal AI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      background-color: black;
      background-image: url('70SMONITOR.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      color: #00ff00;
    }

    /* Screen box positioned over the monitor glass */
    .terminal-screen {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 46vw;
      height: 40vh;
      overflow-y: auto;
      padding: 10px;
    }

    /* Subtle custom scrollbar */
    .terminal-screen::-webkit-scrollbar {
      width: 6px;
    }
    .terminal-screen::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 0, 0.3);
      border-radius: 3px;
    }

    /* Forces text wrapping and terminal glow */
    #notepad {
      display: inline;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
      font-size: 13px;
      line-height: 1.4;
      text-shadow: 0 0 5px rgba(0, 255, 0, 0.7);
    }

    /* Blinking green block cursor */
    .terminal-cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background-color: #00ff00;
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
      box-shadow: 0 0 5px rgba(0, 255, 0, 0.7);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="terminal-screen">
    <span id="notepad"></span><span id="cursor" class="terminal-cursor"></span>
    <div id="matrix-container"></div>
  </div>

  <script>
    const sequence = [
      "AMIBIOS (C) 1994 American Megatrends Inc.\n",
      "CPU: CUSTOM BIO-PROCESSOR ARRAY @ 5.20 GHz\n",
      "Memory Test: 134217728K OK (128 GB RAM)\n",
      "Detecting Primary Storage...\n",
      "[UCPLASTS_LINK_OK]\n",
      "Loading MS-DOS SHIM...\n",
      "C:\\> C:\\VANCE_SYS\\COMMS_ARR.EXE\n"
    ];

    const notepad = document.getElementById("notepad");
    const screenBox = document.querySelector(".terminal-screen");
    let lineIndex = 0;
    let charIndex = 0;

    function typeWriter() {
      if (lineIndex < sequence.length) {
        const currentLine = sequence[lineIndex];
        if (charIndex < currentLine.length) {
          notepad.textContent += currentLine.charAt(charIndex);
          charIndex++;
          screenBox.scrollTop = screenBox.scrollHeight;
          setTimeout(typeWriter, 35);
        } else {
          charIndex = 0;
          lineIndex++;
          setTimeout(typeWriter, 300);
        }
      }
    }

    window.onload = typeWriter;
  </script>

</body>
</html>
